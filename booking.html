<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись — Лезвие</title><meta name="description" content="Лезвие — барбершоп в Смоленске: стрижки, борода, королевское бритьё. Онлайн-запись."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap" data-view="booking">
<section><h2>Онлайн-запись</h2>
<div class="cols" id="bk"><div id="bl">
<div class="glass pad"><h3>1. Услуги</h3><div id="sl"></div></div>
<div class="glass pad"><h3 style="margin-bottom:12px">2. Мастер</h3><div class="chips" id="ms"></div></div>
<div class="glass pad"><h3 style="margin-bottom:12px">3. Дата и время</h3><input type="date" id="dt" aria-label="Дата"><div class="slots" id="slots"></div></div></div>
<aside class="glass pad sum" id="bs"><h3 style="margin-bottom:12px">Ваша запись</h3><div id="calc"></div><form id="bf"><input name="n" required placeholder="Имя"><input name="p" type="tel" required placeholder="+7 900 000-00-00"><button class="btn" style="width:100%">Записаться</button></form></aside></div>
<div class="glass pad empty" id="done" hidden><h3>Вы записаны 🎉</h3><p id="dtxt"></p><a class="btn" data-go="index">На главную</a></div></section>
</main><script src="app.js"></script></body></html>
